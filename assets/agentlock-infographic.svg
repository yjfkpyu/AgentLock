<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AgentLock infographic</title>
  <desc id="desc">AgentLock turns scattered project docs into a verified context layer for AI coding agents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071016"/>
      <stop offset="45%" stop-color="#0a1d21"/>
      <stop offset="100%" stop-color="#11160f"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#102832" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#101711" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="lock" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8ffcff"/>
      <stop offset="50%" stop-color="#55e6b5"/>
      <stop offset="100%" stop-color="#d5ff67"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffc857"/>
      <stop offset="100%" stop-color="#ff7a59"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.38"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#9af7d5" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="18" markerHeight="18" refX="14" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L15,5 L0,10 Z" fill="#63f3c8"/>
    </marker>
    <style>
      .display { font-family: Georgia, 'Times New Roman', serif; font-weight: 700; }
      .sans { font-family: 'Aptos', 'Segoe UI', Helvetica, sans-serif; }
      .mono { font-family: 'SFMono-Regular', 'Cascadia Mono', Consolas, monospace; }
      .small { font-size: 25px; fill: #cbe4dc; }
      .tiny { font-size: 20px; fill: #94aea8; }
      .micro { font-size: 17px; fill: #7d958f; }
      .white { fill: #f2fff9; }
      .muted { fill: #b5cbc5; }
      .cyan { fill: #8ffcff; }
      .lime { fill: #d5ff67; }
      .amber { fill: #ffc857; }
      .nodeTitle { font-size: 24px; font-weight: 700; fill: #eefcf8; }
      .nodeText { font-size: 18px; fill: #a9c0ba; }
      .chipText { font-size: 18px; font-weight: 700; fill: #081113; letter-spacing: 0.4px; }
      .hairline { stroke: #8ffcff; stroke-opacity: 0.18; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <circle cx="1280" cy="120" r="250" fill="#d5ff67" opacity="0.08"/>
  <circle cx="260" cy="780" r="310" fill="#49e8ff" opacity="0.09"/>
  <path d="M-40,680 C250,520 345,830 640,650 C895,495 1010,510 1230,320 C1385,185 1500,245 1660,100" fill="none" stroke="#d5ff67" stroke-opacity="0.18" stroke-width="3"/>

  <g transform="translate(82 72)">
    <text class="display white" x="0" y="0" font-size="74">AgentLock</text>
    <text class="sans cyan" x="2" y="48" font-size="30" font-weight="700">AI-native documentation that keeps coding agents aligned with truth</text>
    <text class="sans tiny" x="2" y="86">Turn scattered docs into a verified operating context for AI-assisted development.</text>
  </g>

  <g transform="translate(76 205)" filter="url(#softShadow)">
    <rect x="0" y="0" width="390" height="520" rx="34" fill="#101820" stroke="#ff7a59" stroke-opacity="0.36"/>
    <text class="sans amber" x="34" y="58" font-size="26" font-weight="800">WITHOUT A CONTEXT LOCK</text>
    <text class="display white" x="34" y="112" font-size="41">Agents guess</text>
    <text class="sans muted" x="34" y="154" font-size="23">when docs drift away from code.</text>

    <g transform="translate(34 196)">
      <rect width="322" height="54" rx="18" fill="#261b1c" stroke="#ff7a59" stroke-opacity="0.42"/>
      <text class="sans small" x="22" y="35">stale README</text>
    </g>
    <g transform="translate(34 268)">
      <rect width="322" height="54" rx="18" fill="#261b1c" stroke="#ff7a59" stroke-opacity="0.42"/>
      <text class="sans small" x="22" y="35">plans mistaken for facts</text>
    </g>
    <g transform="translate(34 340)">
      <rect width="322" height="54" rx="18" fill="#261b1c" stroke="#ff7a59" stroke-opacity="0.42"/>
      <text class="sans small" x="22" y="35">unclear feature scope</text>
    </g>
    <g transform="translate(34 412)">
      <rect width="322" height="54" rx="18" fill="#261b1c" stroke="#ff7a59" stroke-opacity="0.42"/>
      <text class="sans small" x="22" y="35">no doc-code ownership</text>
    </g>
  </g>

  <path d="M505 464 C575 464 605 464 675 464" fill="none" stroke="#63f3c8" stroke-width="5" marker-end="url(#arrow)" opacity="0.88"/>

  <g transform="translate(640 170)" filter="url(#softShadow)">
    <rect x="0" y="0" width="320" height="590" rx="52" fill="url(#panel)" stroke="#8ffcff" stroke-opacity="0.36"/>
    <g transform="translate(80 78)" filter="url(#glow)">
      <path d="M80 0 C37 0 8 31 8 76 L8 120 L38 120 L38 77 C38 50 54 30 80 30 C106 30 122 50 122 77 L122 120 L152 120 L152 76 C152 31 123 0 80 0 Z" fill="none" stroke="url(#lock)" stroke-width="18" stroke-linecap="round"/>
      <rect x="10" y="112" width="140" height="132" rx="30" fill="url(#lock)"/>
      <circle cx="80" cy="166" r="15" fill="#071016"/>
      <rect x="73" y="178" width="14" height="36" rx="7" fill="#071016"/>
    </g>
    <text class="display white" x="160" y="385" font-size="50" text-anchor="middle">Lock AI to</text>
    <text class="display lime" x="160" y="441" font-size="55" text-anchor="middle">Current Truth</text>
    <text class="sans muted" x="160" y="493" font-size="22" text-anchor="middle">AGENTS + SESSION + docs</text>
    <text class="sans muted" x="160" y="526" font-size="22" text-anchor="middle">scope + evidence + validation</text>
  </g>

  <path d="M990 464 C1060 464 1090 464 1160 464" fill="none" stroke="#63f3c8" stroke-width="5" marker-end="url(#arrow)" opacity="0.88"/>

  <g transform="translate(1130 205)" filter="url(#softShadow)">
    <rect x="0" y="0" width="390" height="520" rx="34" fill="#0d1f1b" stroke="#d5ff67" stroke-opacity="0.38"/>
    <text class="sans lime" x="34" y="58" font-size="26" font-weight="800">WITH AGENTLOCK</text>
    <text class="display white" x="34" y="112" font-size="41">Agents align</text>
    <text class="sans muted" x="34" y="154" font-size="23">to verified project context.</text>

    <g transform="translate(34 194)">
      <rect width="150" height="56" rx="18" fill="#d5ff67"/>
      <text class="sans chipText" x="22" y="36">AGENTS</text>
    </g>
    <g transform="translate(204 194)">
      <rect width="150" height="56" rx="18" fill="#8ffcff"/>
      <text class="sans chipText" x="22" y="36">SESSION</text>
    </g>
    <g transform="translate(34 270)">
      <rect width="320" height="58" rx="18" fill="#142d27" stroke="#8ffcff" stroke-opacity="0.34"/>
      <text class="sans nodeTitle" x="22" y="36">feature-registry</text>
    </g>
    <g transform="translate(34 346)">
      <rect width="320" height="58" rx="18" fill="#142d27" stroke="#8ffcff" stroke-opacity="0.34"/>
      <text class="sans nodeTitle" x="22" y="36">doc-code-map</text>
    </g>
    <g transform="translate(34 422)">
      <rect width="320" height="58" rx="18" fill="#142d27" stroke="#8ffcff" stroke-opacity="0.34"/>
      <text class="sans nodeTitle" x="22" y="36">validate-docs</text>
    </g>
  </g>

  <g transform="translate(176 785)">
    <rect x="0" y="0" width="1248" height="72" rx="24" fill="#0d1718" stroke="#8ffcff" stroke-opacity="0.24"/>
    <g transform="translate(28 19)">
      <circle cx="16" cy="16" r="16" fill="#8ffcff"/>
      <text class="mono" x="48" y="25" font-size="22" fill="#dffdf7">Status</text>
    </g>
    <g transform="translate(225 19)">
      <circle cx="16" cy="16" r="16" fill="#d5ff67"/>
      <text class="mono" x="48" y="25" font-size="22" fill="#dffdf7">Track</text>
    </g>
    <g transform="translate(407 19)">
      <circle cx="16" cy="16" r="16" fill="#ffc857"/>
      <text class="mono" x="48" y="25" font-size="22" fill="#dffdf7">Risk</text>
    </g>
    <g transform="translate(575 19)">
      <circle cx="16" cy="16" r="16" fill="#55e6b5"/>
      <text class="mono" x="48" y="25" font-size="22" fill="#dffdf7">code_owns</text>
    </g>
    <g transform="translate(820 19)">
      <circle cx="16" cy="16" r="16" fill="#ff7a59"/>
      <text class="mono" x="48" y="25" font-size="22" fill="#dffdf7">docs: frozen</text>
    </g>
    <g transform="translate(1100 19)">
      <circle cx="16" cy="16" r="16" fill="#b9f7ff"/>
      <text class="mono" x="48" y="25" font-size="22" fill="#dffdf7">ADR</text>
    </g>
  </g>

  <text class="sans micro" x="80" y="862">AgentLockDoc · Chinese and English templates for AI-assisted software development</text>
  <text class="sans micro" x="1520" y="862" text-anchor="end">Copy a template. Fill AGENTS. Verify reality.</text>
</svg>
